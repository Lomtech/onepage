<!doctype html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f3efe6" />
  <meta name="description"
    content="Lom-Ali Imadaev · Senior SAP Treasury Consultant · ABAP-Entwickler · Grappler. Visitenkarte mit Kontakt, CV und Profilen." />
  <title>Lom-Ali Imadaev</title>

  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Inter:wght@300;400&display=swap"
    rel="stylesheet" />

  <script defer src="https://www.impulseto.work/api/pixel.js" data-website-id="fed29c83-8581-45f3-838a-1f93dc6990d5"
    data-domain="limadaev.de" data-cookieless="true" data-allow-localhost="true"></script>

  <style>
    :root {
      --bone: #f3efe6;
      --bone-deep: #ebe5d6;
      --ink: #1a1814;
      --ink-soft: #4a4640;
      --line: #cfc7b4;
      --shadow:
        0 1px 0 rgba(0, 0, 0, .04),
        0 12px 28px -14px rgba(60, 52, 30, .22),
        0 30px 60px -30px rgba(60, 52, 30, .18);
      --card-w: min(560px, 92vw);
      --card-h: clamp(240px, 58vw, 340px);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: "Cormorant Garamond", "EB Garamond", Garamond, "Times New Roman", serif;
      color: var(--ink);
      background: radial-gradient(1200px 800px at 50% 20%, #fbf8f0 0%, var(--bone) 55%, var(--bone-deep) 100%);
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
      overflow: hidden;
      letter-spacing: .02em;
    }

    /* paper grain — sehr subtil */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .35;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.18  0 0 0 0 0.16  0 0 0 0 0.12  0 0 0 0.06 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    .stage {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      perspective: 1800px;
    }

    .card {
      width: var(--card-w);
      height: var(--card-h);
      position: relative;
      cursor: pointer;
    }

    .face {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #fbf7ec 0%, #f1ecdf 100%);
      border: 1px solid var(--line);
      border-radius: 2px;
      box-shadow: var(--shadow);
      padding: clamp(22px, 4vw, 40px);
      display: grid;
      transition: opacity 700ms cubic-bezier(.2, .7, .1, 1),
                  transform 700ms cubic-bezier(.2, .7, .1, 1);
    }

    /* Crossfade flip: front oben, back darunter. Pointer-events folgen der Sichtbarkeit. */
    .front { opacity: 1; pointer-events: auto; transform: scale(1); }
    .back  { opacity: 0; pointer-events: none; transform: scale(.96); }
    .card.is-flipped .front { opacity: 0; pointer-events: none; transform: scale(.96); }
    .card.is-flipped .back  { opacity: 1; pointer-events: auto; transform: scale(1); }

    .face::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(0, 0, 0, .06);
      border-radius: 1px;
      pointer-events: none;
    }

    .face::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 2px;
      pointer-events: none;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .5),
        inset 0 -1px 0 rgba(0, 0, 0, .05);
    }

    /* ============ FRONT ============ */
    .front { grid-template-rows: auto 1fr auto; align-items: stretch; }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-family: "Inter", system-ui, sans-serif;
      font-weight: 300;
      font-size: clamp(9px, 1.05vw, 11px);
      letter-spacing: .42em;
      text-transform: uppercase;
      color: var(--ink-soft);
      position: relative;
      z-index: 1;
    }

    .initials {
      align-self: center;
      justify-self: center;
      font-family: "Cormorant Garamond", serif;
      font-weight: 300;
      font-size: clamp(110px, 22vw, 220px);
      line-height: .9;
      letter-spacing: .14em;
      padding-left: .14em;
      color: var(--ink);
      user-select: none;
      transition: letter-spacing 800ms cubic-bezier(.2, .7, .1, 1);
      position: relative;
      z-index: 1;
    }
    .card:hover .initials { letter-spacing: .18em; }

    .tagline {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(12px, 1.4vw, 15px);
      color: var(--ink-soft);
      position: relative;
      z-index: 1;
    }
    .tagline .name {
      font-style: normal;
      font-family: "Inter", sans-serif;
      font-weight: 300;
      letter-spacing: .32em;
      text-transform: uppercase;
      font-size: clamp(9px, 1vw, 10.5px);
      color: var(--ink);
      white-space: nowrap;
    }
    .tagline .role { text-align: right; }

    .hint {
      position: absolute;
      bottom: -28px;
      left: 0;
      right: 0;
      text-align: center;
      font-family: "Inter", sans-serif;
      font-weight: 300;
      font-size: 10.5px;
      letter-spacing: .42em;
      text-transform: uppercase;
      color: var(--ink-soft);
      opacity: .55;
      transition: opacity 300ms ease;
    }
    .card.is-flipped .hint { opacity: 0; }

    /* ============ BACK ============ */
    .back { grid-template-rows: auto 1fr auto; }

    .links {
      align-self: center;
      justify-self: center;
      width: 100%;
      max-width: 360px;
      display: grid;
      gap: clamp(4px, 1.2vw, 14px);
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .links a.link {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: baseline;
      padding: clamp(6px, 1.4vw, 9px) 2px;
      text-decoration: none;
      color: var(--ink);
      border-bottom: 1px solid rgba(0, 0, 0, .08);
      font-family: "Cormorant Garamond", serif;
      font-weight: 400;
      font-size: clamp(15px, 2.1vw, 21px);
      letter-spacing: .04em;
      transition: padding-left 380ms cubic-bezier(.2, .7, .1, 1),
        color 200ms ease;
    }
    .links a.link .arrow {
      font-family: "Inter", sans-serif;
      font-weight: 300;
      font-size: 11px;
      letter-spacing: .4em;
      text-transform: uppercase;
      color: var(--ink-soft);
      transition: transform 380ms cubic-bezier(.2, .7, .1, 1),
        color 200ms ease;
    }
    .links a.link:hover {
      padding-left: 10px;
      color: #000;
    }
    .links a.link:hover .arrow {
      transform: translateX(6px);
      color: var(--ink);
    }

    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      font-family: "Inter", sans-serif;
      font-weight: 300;
      font-size: clamp(8.5px, 1vw, 10.5px);
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    .footer-row .motto {
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(11px, 1.2vw, 13px);
      letter-spacing: .04em;
      text-transform: none;
      color: var(--ink-soft);
    }
    .footer-row .legal-links a {
      color: inherit;
      text-decoration: none;
      margin-left: 12px;
      transition: color 200ms ease;
    }
    .footer-row .legal-links a:hover { color: var(--ink); }

    /* watermark "L" im Hintergrund der Front */
    .watermark {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(220px, 38vw, 360px);
      color: rgba(26, 24, 20, .025);
      letter-spacing: -.02em;
      user-select: none;
      z-index: 0;
    }

    .card { opacity: 0; animation: fade-in 1100ms cubic-bezier(.2, .7, .1, 1) 120ms forwards; }
    @keyframes fade-in {
      to { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card, .links a, .links a .arrow, .initials {
        transition: none !important;
        animation: none !important;
      }
    }

    /* alte Counter-Spans aus app.js verstecken — werden noch befüllt, sollen aber nicht erscheinen */
    .links a.link .counter { display: none; }
  </style>
</head>

<body>
  <main class="stage">
    <article class="card" id="card" role="button" tabindex="0" aria-label="Visitenkarte umdrehen">

      <!-- FRONT -->
      <section class="face front" aria-hidden="false">
        <header class="meta">
          <span>Established · MMXXVI</span>
          <span>N° 001</span>
        </header>

        <div class="watermark" aria-hidden="true">L</div>

        <div class="initials" aria-hidden="true">L·I</div>

        <footer class="tagline">
          <span class="name">Lom-Ali Imadaev</span>
          <span class="role">Grappler · SAP Treasury · ABAP</span>
        </footer>

        <div class="hint">↳ tap to reveal</div>
      </section>

      <!-- BACK -->
      <section class="face back" aria-hidden="true">
        <header class="meta">
          <span>Lom-Ali Imadaev</span>
          <span>85k EUR · p.a. fix</span>
        </header>

        <ul class="links" aria-label="Kontakt">
          <li>
            <a class="link" data-id="whatsapp" href="https://wa.me/4915127600077" target="_blank" rel="noopener">
              <span>WhatsApp</span>
              <span class="arrow">message →</span>
              <span class="counter" data-id="whatsapp">0</span>
            </a>
          </li>
          <li>
            <a class="link" data-id="instagram" href="https://www.instagram.com/lom_combatgrappler/" target="_blank" rel="noopener">
              <span>Instagram</span>
              <span class="arrow">follow →</span>
              <span class="counter" data-id="instagram">0</span>
            </a>
          </li>
          <li>
            <a class="link" data-id="linkedin" href="https://www.linkedin.com/in/lom-ali-imadaev-0a0915184/" target="_blank" rel="noopener">
              <span>LinkedIn</span>
              <span class="arrow">connect →</span>
              <span class="counter" data-id="linkedin">0</span>
            </a>
          </li>
          <li>
            <a class="link" data-id="cv" href="https://lomtech.github.io/cv/" target="_blank" rel="noopener">
              <span>Curriculum Vitæ</span>
              <span class="arrow">open →</span>
              <span class="counter" data-id="cv">0</span>
            </a>
          </li>
        </ul>

        <footer class="footer-row">
          <span class="motto">Never pull guard.</span>
          <span class="legal-links">
            <a href="impressum.html">Impressum</a>
            <a href="datenschutz.html">Datenschutz</a>
          </span>
        </footer>
      </section>
    </article>
  </main>

  <script>
    (() => {
      const card = document.getElementById("card");
      const flip = () => card.classList.toggle("is-flipped");

      card.addEventListener("click", (e) => {
        if (e.target.closest("a")) return;
        flip();
      });
      card.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          flip();
        }
      });

      const front = card.querySelector(".front");
      const back = card.querySelector(".back");
      const sync = () => {
        const flipped = card.classList.contains("is-flipped");
        front.setAttribute("aria-hidden", flipped ? "true" : "false");
        back.setAttribute("aria-hidden", flipped ? "false" : "true");
      };
      new MutationObserver(sync).observe(card, { attributes: true, attributeFilter: ["class"] });

      card.querySelectorAll(".back a").forEach(a => a.addEventListener("click", e => e.stopPropagation()));
    })();
  </script>
  <script src="app.js"></script>
</body>

</html>
